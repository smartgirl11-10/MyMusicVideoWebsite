@page
@model IndexModel
@{
    ViewData["Title"] = "Home page";
}

<div class="text-center music-page container">
    <h1 class="display-4">My Favorite Song — Diljit Dosanjh: "Charmer"</h1>
    <p>Enjoy the embedded music video and an interactive album cover.</p>

    <div class="row justify-content-center align-items-start mt-4">
        <div class="col-md-7">
            <div class="video-container">
                <iframe src="https://www.youtube.com/embed/CGhGAVH2GqY"
                        title="Diljit Dosanjh - Charmer"
                        frameborder="0"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                        allowfullscreen></iframe>
            </div>
        </div>

        <div class="col-md-4 text-center mt-3 mt-md-0">
            <img id="albumCover"
                 src="https://img.youtube.com/vi/CGhGAVH2GqY/maxresdefault.jpg"
                 alt="Album cover"
                 class="img-fluid album-cover" />

            <div class="mt-3">
                <button id="spinBtn" class="btn btn-primary"> Album cover </button>
                <button id="resetBtn" class="btn btn-outline-light ms-2">Reset</button>
            </div>
        </div>
    </div>
</div>
